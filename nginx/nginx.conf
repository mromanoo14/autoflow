# Balanceador de carga do serviço de Estoque (Eixo X do Cubo AKF)
events { worker_connections 2048; }

http {
    access_log off;

    upstream estoque {
        # Padrão do Nginx = Round Robin (uma requisição para cada réplica).
        # Para "Menor Conexão", descomente a linha abaixo:
        # least_conn;
        server estoque-1:5001 max_fails=3 fail_timeout=5s;
        server estoque-2:5001 max_fails=3 fail_timeout=5s;
        keepalive 64;   # pool de conexões Nginx -> réplicas
    }

    server {
        listen 80;
        location / {
            proxy_pass http://estoque;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            # Mostra no header qual réplica respondeu (útil no vídeo)
            add_header X-Upstream $upstream_addr always;
        }
    }
}
